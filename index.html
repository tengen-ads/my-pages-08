        * {

        body {

            min-height: 100vh;
            display: flex;
            justify-content: center;

        /* animated background canvas effect */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 128, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 25px 20px;
            text-align: center;
            z-index: 2;
            position: relative;
        }

        /* Logo Styling & Animation */
        .logo-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #00ff88, #00d2ff, #00ff88);
            background-size: 200% 200%;
            animation: borderRotate 3s linear infinite, float 3s ease-in-out infinite;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Headline Styling */
        .headline {
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
            to { text-shadow: 0 0 20px rgba(0, 255, 136, 0.9), 0 0 30px rgba(0, 210, 255, 0.7); }
        }

        /* Subtext */

            font-size: 15px;

            line-height: 1.4;

            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 195, 255, 0.5);
            transition: all 0.3s ease;
            animation: pulseBtn 1.8s infinite;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-telegram:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
            background: linear-gradient(90deg, #00ff88, #0088cc);

        .btn-telegram svg {
